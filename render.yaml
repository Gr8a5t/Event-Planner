services:
  - type: web
    name: event-planner
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: APP_NAME
        value: "Event Planner"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        sync: false  # Set manually after deploy: https://event-planner-xxxx.onrender.com
      - key: APP_KEY
        sync: false  # Will be auto-generated on first boot if empty
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: event-planner-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: event-planner-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: event-planner-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: event-planner-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: event-planner-db
          property: password
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: LOG_CHANNEL
        value: stderr
      - key: FILESYSTEM_DISK
        value: local

databases:
  - name: event-planner-db
    plan: free
    region: oregon
